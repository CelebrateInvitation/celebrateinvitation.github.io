<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin:0;
  background:#cfcfcf;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial;
}

#book {
  width:900px;
  height:600px;
  margin-top:40px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.3);
  border-radius: 12px;
}
.page {
  background:white;
}
img {
  width:100%;
  height:100%;
  object-fit:cover;
  image-rendering: auto;
}
</style>
</head>

<body>

<h2>Andi & Rina</h2>

<div id="book"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 600,
    height: 800,
    size: "fixed",
    showCover: true,
    maxShadowOpacity: 0.6,
    mobileScrollSupport: false
  }
);

pageFlip.loadFromImages([
  "page1.jpg",
  "page2.jpg",
  "page3.jpg",
  "page4.jpg",
  "page5.jpg",
  "page6.jpg",
  "page7.jpg",
  "page8.jpg"
]);
</script>

</body>
</html>
