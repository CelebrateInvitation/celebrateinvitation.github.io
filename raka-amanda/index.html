<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raka & Amanda Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* Luxury glow */
body::before{
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:1200px;
  height:1200px;
  background:radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:0;
}

/* Moving subtle light */
.light-effect{
  position:fixed;
  top:0;
  left:-50%;
  width:50%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.05),
    transparent
  );
  transform:skewX(-20deg);
  animation:lightMove 10s linear infinite;
  pointer-events:none;
  z-index:1;
}

@keyframes lightMove{
  0%{ left:-50%; }
  100%{ left:150%; }
}

h2{
  margin-top:50px;
  font-weight:300;
  letter-spacing:6px;
  font-size:28px;
  text-transform:uppercase;
  z-index:2;
}

#guest-name{
  margin-top:15px;
  font-size:14px;
  letter-spacing:2px;
  color:#aaa;
  text-align:center;
  z-index:2;
}
#guest-name strong{
  display:block;
  margin-top:8px;
  font-size:20px;
  font-weight:600;
  color:#fff;
}

#book-wrapper{
  margin-top:60px;
  perspective:2500px;
  z-index:2;
}

#book{
  position:relative;
  border-radius:14px;
  transform-origin: top center;

  box-shadow:
    0 60px 180px rgba(0,0,0,0.9),
    0 20px 60px rgba(255,255,255,0.05),
    inset 0 0 20px rgba(255,255,255,0.03);

  background:#111;
}

#book::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:4px;
  transform:translateX(-50%);
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(255,255,255,0.15),
    rgba(0,0,0,0.6),
    rgba(255,255,255,0.15),
    transparent
  );
  pointer-events:none;
}

canvas{
  border-radius:6px;
  background:#000;
}
</style>
</head>

<body>

<div class="light-effect"></div>

<h2>Raka & Amanda</h2>
<div id="guest-name"></div>

<div id="book-wrapper">
  <div id="book"></div>
</div>

<audio id="bg-music" loop playsinline>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="flipSound" preload="auto">
  <source src="paper-flip.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";
const pageWidth = 500;
const pageHeight = 707;
const isMobile = window.innerWidth < 768;

const bookElement = document.getElementById("book");

/* PAGE FLIP */
const pageFlip = new St.PageFlip(bookElement, {
  width: pageWidth,
  height: pageHeight,
  size: "fixed",
  autoSize: false,
  showCover: true,
  usePortrait: false,      // tetap 2 halaman di HP
  flippingTime: 800,
  maxShadowOpacity: 0.6,
  drawShadow: true,
  mobileScrollSupport: false,
  useMouseEvents: true,
  swipeDistance: 15
});

/* RESPONSIVE SCALE */
function scaleBook(){
  const screenWidth = window.innerWidth;
  const fullWidth = pageWidth * 2;
  const scale = Math.min(screenWidth / fullWidth, 1);
  bookElement.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", scaleBook);

/* AUDIO FIX (no auto flip sound) */
const flipSound = document.getElementById("flipSound");
const bgMusic = document.getElementById("bg-music");

let userHasInteracted = false;

document.addEventListener("click", function unlock(){
  if(!userHasInteracted){
    bgMusic.volume = 0.6;
    bgMusic.play().catch(()=>{});
    userHasInteracted = true;
  }
  document.removeEventListener("click", unlock);
});

pageFlip.on("flip", function(){
  if(!userHasInteracted) return;
  flipSound.currentTime = 0;
  flipSound.play().catch(()=>{});
});

/* PDF FAST LOAD */
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

pdfjsLib.getDocument(pdfUrl).promise.then(async pdf=>{

  const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
  const renderScale = isMobile ? 1 : 1.3;

  async function renderPage(pageNumber){
    const page = await pdf.getPage(pageNumber);
    const viewport = page.getViewport({ scale: renderScale });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width * dpr;
    canvas.height = viewport.height * dpr;

    canvas.style.width = pageWidth + "px";
    canvas.style.height = pageHeight + "px";

    context.setTransform(dpr,0,0,dpr,0,0);
    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = "high";

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    return canvas;
  }

  /* Render first page immediately */
  const firstPage = await renderPage(1);
  pageFlip.loadFromHTML([firstPage]);
  scaleBook();

  /* Render remaining pages progressively */
  const pages = [firstPage];

  for(let i=2;i<=pdf.numPages;i++){
    const nextPage = await renderPage(i);
    pages.push(nextPage);
    pageFlip.updateFromHtml(pages);
  }

});

/* GUEST SYSTEM */
const params = new URLSearchParams(window.location.search);
let guest = params.get("to") || "Tamu Undangan";
guest = decodeURIComponent(guest.replace(/\+/g," "));
document.getElementById("guest-name").innerHTML =
`PREPARED EXCLUSIVELY FOR<br><strong>${guest}</strong>`;
</script>

</body>
</html>
