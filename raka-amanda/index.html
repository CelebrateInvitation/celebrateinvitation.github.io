<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raka & Amanda Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* White ambient glow background */
body::before{
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:1200px;
  height:1200px;
  background:radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 40%, transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:0;
}

/* ===== FADE ANIMATION ===== */
.fade-in{
  opacity:0;
  transform:translateY(20px);
  transition:all 1.2s ease;
}
.fade-in.show{
  opacity:1;
  transform:translateY(0);
}

/* ===== HEADER ===== */
h2{
  margin-top:50px;
  font-weight:300;
  letter-spacing:6px;
  font-size:28px;
  text-transform:uppercase;
}

/* ===== GUEST ===== */
#guest-name{
  margin-top:15px;
  font-size:14px;
  letter-spacing:2px;
  color:#aaa;
  text-align:center;
}
#guest-name strong{
  display:block;
  margin-top:8px;
  font-size:20px;
  font-weight:600;
  color:#fff;
}

/* ===== BOOK WRAPPER ===== */
#book-wrapper{
  margin-top:60px;
  perspective:2000px;
}

/* ===== BOOK ===== */
#book{
  position:relative;
  z-index:2;
  box-shadow:
    0 40px 120px rgba(255,255,255,0.05),
    0 0 40px rgba(255,255,255,0.08),
    0 0 1px rgba(255,255,255,0.4);
  border-radius:14px;
  backdrop-filter: blur(3px);
}

/* Garis tengah buku */
#book::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:2px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.15),transparent);
  transform:translateX(-50%);
  pointer-events:none;
}

canvas{
  border-radius:4px;
}

.light-effect{
  position:fixed;
  top:0;
  left:-50%;
  width:50%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.05),
    transparent
  );
  transform:skewX(-20deg);
  animation:lightMove 8s linear infinite;
  pointer-events:none;
  z-index:1;
}

@keyframes lightMove{
  0%{ left:-50%; }
  100%{ left:150%; }
}
  
</style>
</head>

<body>

<div class="light-effect"></div>
  
<h2 class="fade-in" id="title">Raka & Amanda</h2>

<div id="guest-name" class="fade-in"></div>

<div id="book-wrapper" class="fade-in">
  <div id="book"></div>
</div>

<audio id="bg-music" loop preload="auto" playsinline>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="flipSound" preload="auto">
  <source src="paper-flip.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";

const pageWidth = 500;
const pageHeight = 707;

const bookElement = document.getElementById("book");

const pageFlip = new St.PageFlip(
  bookElement,
  {
    width: pageWidth,
    height: pageHeight,
    size: "fixed",
    autoSize: false,
    showCover: true,
    usePortrait: false, // 🔥 selalu 2 halaman
    maxShadowOpacity: 0.4,
    flippingTime: 900,
    mobileScrollSupport: false
  }
);

/* ===== AUTO SCALE FOR MOBILE (STILL 2 PAGES) ===== */
function scaleBook() {
  const screenWidth = window.innerWidth;

}

window.addEventListener("resize", scaleBook);
window.addEventListener("load", scaleBook);

/* ===== AUDIO SYSTEM ===== */
const flipSound = document.getElementById("flipSound");
const bgMusic = document.getElementById("bg-music");

/* Unlock audio after first click */
let musicStarted = false;

document.addEventListener("click", function unlockAudio() {

  if (!musicStarted) {
    bgMusic.volume = 0.6;
    bgMusic.play().catch(()=>{});
    musicStarted = true;
  }

  document.removeEventListener("click", unlockAudio);
});

/* Play sound only when flipping */
let isFirstFlip = true;

pageFlip.on("flip", function (e) {

  if (isFirstFlip) {
    isFirstFlip = false;
    return;
  }

  if (e.data > 0) {
    flipSound.currentTime = 0;
    flipSound.play().catch(()=>{});
  }
});

pdfjsLib.GlobalWorkerOptions.workerSrc ="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function renderPage(pdf, pageNumber, scale, dpr) {
  const page = await pdf.getPage(pageNumber);
  const viewport = page.getViewport({ scale });

  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");

  canvas.width = viewport.width * dpr;
  canvas.height = viewport.height * dpr;

  canvas.style.width = pageWidth + "px";
  canvas.style.height = pageHeight + "px";

  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = "high";

  await page.render({
    canvasContext: context,
    viewport: viewport
  }).promise;

  return canvas;
}
  
  pdfjsLib.getDocument({
    url: pdfUrl,
    disableAutoFetch: false,
    disableStream: false
  }).promise.then(async pdf => {

    const totalPages = pdf.numPages;
    const renderedPages = [];

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const isMobile = window.innerWidth < 768;
    const renderScale = isMobile ? 1.2 : 1.6; // 🔥 lebih ringan tapi tetap tajam

    // ✅ Render halaman pertama dulu (biar cepat muncul)
    const firstPage = await renderPage(pdf, 1, renderScale, dpr);
    renderedPages.push(firstPage);

    pageFlip.loadFromHTML(renderedPages);
    scaleBook();
    document.getElementById("book-wrapper").classList.add("show");

    // ✅ Render sisanya di background
    for (let i = 2; i <= totalPages; i++) {
      const nextPage = await renderPage(pdf, i, renderScale, dpr);
      pageFlip.loadFromHTML([...renderedPages, nextPage]);
      renderedPages.push(nextPage);
    }

  });

  Promise.all(pages).then(resolvedPages => {
    pageFlip.loadFromHTML(resolvedPages);
    scaleBook();
    document.getElementById("book-wrapper").classList.add("show");
  });

});

/* ===== GUEST NAME SYSTEM ===== */
const params = new URLSearchParams(window.location.search);
let guest = params.get("to");

if (!guest) guest = "Tamu Undangan";

guest = decodeURIComponent(guest.replace(/\+/g, " "));

document.getElementById("guest-name").innerHTML = `
  PREPARED EXCLUSIVELY FOR
  <strong>${guest}</strong>
`;

/* ===== FADE IN TEXT ===== */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("title").classList.add("show");
  }, 300);

  setTimeout(() => {
    document.getElementById("guest-name").classList.add("show");
  }, 700);
});
</script>

</body>
</html>
