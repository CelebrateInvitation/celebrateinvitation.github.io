<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
  overflow:hidden;
}

/* Lighting */
body::before{
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:1100px;
  height:1100px;
  background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#book-wrapper{
  margin-top:60px;
  perspective:2200px;
  position:relative;
}

/* BOOK */
#book{
  position:relative;
  border-radius:14px;
  background:#111;
  box-shadow:
    0 60px 160px rgba(0,0,0,0.9),
    0 20px 50px rgba(255,255,255,0.05);
  transform-style:preserve-3d;
  touch-action:pan-y; /* 🔥 swipe lebih mudah */
}

/* 🔥 REALISTIC CENTER SPINE */
.spine{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:14px;
  height:100%;
  background:linear-gradient(
    to right,
    rgba(0,0,0,0.8),
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.8)
  );
  z-index:5;
  pointer-events:none;
  transition:opacity 0.2s ease;
}

/* Saat swipe berlangsung spine hilang */
.spine.hide{
  opacity:0;
}

canvas{
  border-radius:6px;
  backface-visibility:hidden;
  transform:translateZ(0);
}
</style>
</head>

<body>

<div id="book-wrapper">
  <div id="book"></div>
  <div class="spine" id="spine"></div>
</div>

<script>
const pdfUrl = "magazinevol1.pdf";
const pageWidth = 500;
const pageHeight = 707;
const isMobile = window.innerWidth < 768;

const bookElement = document.getElementById("book");
const spine = document.getElementById("spine");

/* ==============================
   PAGE FLIP CONFIG (HP SMOOTH)
============================== */
const pageFlip = new St.PageFlip(bookElement, {
  width: pageWidth,
  height: pageHeight,
  size: "fixed",
  autoSize: false,
  showCover: true,
  usePortrait: false,     // tetap 2 halaman

  flippingTime: 700,
  maxShadowOpacity: 0.45,
  drawShadow: true,

  useMouseEvents: true,
  mobileScrollSupport: false,
  swipeDistance: 5,       // 🔥 lebih sensitif
  clickEventForward: true
});

/* ==============================
   RESPONSIVE SCALE
============================== */
function scaleBook(){
  const screenWidth = window.innerWidth;
  const scale = Math.min(screenWidth / (pageWidth * 2), 1);
  bookElement.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", scaleBook);

/* ==============================
   REALISTIC SPINE BEHAVIOR
============================== */

/* Saat mulai swipe */
pageFlip.on("folding", () => {
  spine.classList.add("hide");
});

/* Saat flip selesai */
pageFlip.on("flip", () => {
  spine.classList.remove("hide");
});

/* Kalau cancel swipe */
pageFlip.on("changeOrientation", () => {
  spine.classList.remove("hide");
});

/* ==============================
   PDF RENDER
============================== */
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

(async()=>{
  const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
  const pages = [];

  const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
  const renderScale = isMobile ? 1.1 : 1.4;

  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: renderScale });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = viewport.width * dpr;
    canvas.height = viewport.height * dpr;
    canvas.style.width = pageWidth + "px";
    canvas.style.height = pageHeight + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
    await page.render({ canvasContext: ctx, viewport }).promise;

    pages.push(canvas);
  }

  pageFlip.loadFromHTML(pages);
  scaleBook();
})();
</script>

</body>
</html>
