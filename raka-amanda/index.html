<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin:0;
  background: linear-gradient(to bottom, #e9e9e9, #cfcfcf);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial;
}

#book {
  margin-top:40px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.3);
  border-radius: 12px;
}

.page {
  background:white;
}

img {
  width:100%;
  height:auto;
  display:block;
}

canvas {
  image-rendering: auto;
}
</style>
</head>

<body>

<h2>New Raka & Amanda</h2>

<div id="book"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 380,          // kecilkan dari 450
    height: 537,         // 380 x (636/450)
    size: "fixed",       // kembali ke fixed
    autoSize: false,
    showCover: true,
    maxShadowOpacity: 0.25,
    drawShadow: false,
    flippingTime: 700,
    usePortrait: true,
    mobileScrollSupport: false
  }
);
  
pageFlip.loadFromImages([
  "1.jpg",
  "2.jpg",
  "3.jpg",
  "4.jpg",
  "5.jpg",
  "6.jpg",
  "7.jpg",
  "8.jpg"
]);
</script>

</body>
</html>
