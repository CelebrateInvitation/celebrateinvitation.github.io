<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:linear-gradient(to bottom,#e9e9e9,#cfcfcf);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial;
}

h2{
  margin-top:30px;
}

#book{
  margin-top:40px;
  box-shadow:0 40px 80px rgba(0,0,0,0.3);
  border-radius:12px;
}

.page{
  background:white;
}
</style>
</head>

<body>

<h2>Raka & Amanda</h2>
<div id="book"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";

const pageWidth = 500;
const pageHeight = 707;

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 500,
    height: 707,
    size: "fixed",
    autoSize: true,
    showCover: true,     // penting
    usePortrait: false,  // 2 halaman
    startPage: 0,
    maxShadowOpacity: 0.5,
    drawShadow: true,
    flippingTime: 800,
    mobileScrollSupport: false
  }
);

pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {

  const pages = [];

  for (let num = 1; num <= pdf.numPages; num++) {

    pages.push(
      pdf.getPage(num).then(page => {

        const scale = 2; // retina sharp
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        const dpr = window.devicePixelRatio || 1;

        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;

        canvas.style.width = pageWidth + "px";
        canvas.style.height = pageHeight + "px";

        context.setTransform(dpr, 0, 0, dpr, 0, 0);

        page.render({
          canvasContext: context,
          viewport: viewport
        });

        return canvas;
      })
    );
  }

  Promise.all(pages).then(resolvedPages => {
    pageFlip.loadFromHTML(resolvedPages);
  });

});
</script>

</body>
</html>
