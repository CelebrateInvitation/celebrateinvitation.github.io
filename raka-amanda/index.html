<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raka & Amanda Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
  overflow-x:hidden;
}

/* ===== FADE ANIMATION ===== */
.fade-in{
  opacity:0;
  transform:translateY(20px);
  transition:all 1.2s ease;
}
.fade-in.show{
  opacity:1;
  transform:translateY(0);
}

/* ===== HEADER ===== */
h2{
  margin-top:50px;
  font-weight:300;
  letter-spacing:6px;
  font-size:28px;
  text-transform:uppercase;
}

/* ===== GUEST ===== */
#guest-name{
  margin-top:15px;
  font-size:14px;
  letter-spacing:2px;
  color:#aaa;
  text-align:center;
}
#guest-name strong{
  display:block;
  margin-top:8px;
  font-size:20px;
  font-weight:600;
  color:#fff;
}

/* ===== BOOK WRAPPER ===== */
#book-wrapper{
  margin-top:60px;
  perspective:2000px;
}

/* ===== BOOK ===== */
#book{
  box-shadow:
    0 40px 120px rgba(255,255,255,0.08),
    0 0 0 1px rgba(255,255,255,0.05);
  border-radius:14px;
  transform-origin: top center;
  transition:transform 0.3s ease;
}

/* Garis tengah buku */
#book::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:2px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.15),transparent);
  transform:translateX(-50%);
  pointer-events:none;
}

canvas{
  border-radius:4px;
}
</style>
</head>

<body>

<h2 class="fade-in" id="title">Raka & Amanda</h2>

<div id="guest-name" class="fade-in"></div>

<div id="book-wrapper" class="fade-in">
  <div id="book"></div>
</div>

<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="flipSound" preload="auto">
  <source src="paper-flip.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";

const pageWidth = 500;
const pageHeight = 707;

const bookElement = document.getElementById("book");

const pageFlip = new St.PageFlip(
  bookElement,
  {
    width: pageWidth,
    height: pageHeight,
    size: "fixed",
    autoSize: false,
    showCover: true,
    usePortrait: false, // 🔥 selalu 2 halaman
    maxShadowOpacity: 0.4,
    flippingTime: 900,
    mobileScrollSupport: false
  }
);

/* ===== AUTO SCALE FOR MOBILE (STILL 2 PAGES) ===== */
function scaleBook() {
  const screenWidth = window.innerWidth;
  const fullWidth = pageWidth * 2;
  const scale = Math.min(screenWidth / fullWidth, 1);

  bookElement.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", scaleBook);
window.addEventListener("load", scaleBook);

/* ===== AUDIO SYSTEM ===== */
const flipSound = document.getElementById("flipSound");
const bgMusic = document.getElementById("bg-music");

/* Unlock audio after first click */
document.addEventListener("click", function unlockAudio() {

  bgMusic.play().catch(()=>{});

  flipSound.play().then(() => {
    flipSound.pause();
    flipSound.currentTime = 0;
  }).catch(()=>{});

  document.removeEventListener("click", unlockAudio);
});

/* Play sound only when flipping */
let isFirstFlip = true;

pageFlip.on("flip", function (e) {

  if (isFirstFlip) {
    isFirstFlip = false;
    return;
  }

  if (e.data > 0) {
    flipSound.currentTime = 0;
    flipSound.play().catch(()=>{});
  }
});

/* ===== LOAD PDF SHARP RENDER ===== */
pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {

  const pages = [];

  for (let num = 1; num <= pdf.numPages; num++) {

    pages.push(
      pdf.getPage(num).then(page => {

        const scale = 2;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        const dpr = window.devicePixelRatio || 1;

        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;

        canvas.style.width = pageWidth + "px";
        canvas.style.height = pageHeight + "px";

        context.setTransform(dpr, 0, 0, dpr, 0, 0);

        return page.render({
          canvasContext: context,
          viewport: viewport
        }).promise.then(() => canvas);
      })
    );
  }

  Promise.all(pages).then(resolvedPages => {
    pageFlip.loadFromHTML(resolvedPages);
    scaleBook();
    document.getElementById("book-wrapper").classList.add("show");
  });

});

/* ===== GUEST NAME SYSTEM ===== */
const params = new URLSearchParams(window.location.search);
let guest = params.get("to");

if (!guest) guest = "Tamu Undangan";

guest = decodeURIComponent(guest.replace(/\+/g, " "));

document.getElementById("guest-name").innerHTML = `
  PREPARED EXCLUSIVELY FOR
  <strong>${guest}</strong>
`;

/* ===== FADE IN TEXT ===== */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("title").classList.add("show");
  }, 300);

  setTimeout(() => {
    document.getElementById("guest-name").classList.add("show");
  }, 700);
});
</script>

</body>
</html>
