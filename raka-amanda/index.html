<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:linear-gradient(to bottom,#e9e9e9,#cfcfcf);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
}

/* ===== ANIMATION ===== */
.fade-in{
  opacity:0;
  transform:translateY(20px);
  transition:all 1s ease;
}

.fade-in.show{
  opacity:1;
  transform:translateY(0);
}

/* HEADER */
h2{
  margin-top:40px;
  font-weight:600;
  letter-spacing:3px;
  font-size:30px;
  text-transform:uppercase;
  color:#222;
}

/* GUEST */
#guest-name{
  margin-top:10px;
  font-size:16px;
  text-align:center;
  color:#555;
  letter-spacing:1px;
}

#guest-name strong{
  display:block;
  margin-top:6px;
  font-size:20px;
  font-weight:600;
  color:#000;
}

/* BOOK */
#book{
  margin-top:40px;
  box-shadow:0 40px 80px rgba(0,0,0,0.25);
  border-radius:12px;
}
</style>
</head>

<body>

<h2 class="fade-in" id="title">Raka & Amanda</h2>

<div id="guest-name" class="fade-in"></div>

<div id="book" class="fade-in"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";

const pageWidth = 500;
const pageHeight = 707;

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: pageWidth,
    height: pageHeight,
    size: "fixed",
    autoSize: false,
    showCover: true,
    usePortrait: false,
    maxShadowOpacity: 0.3,
    flippingTime: 800,
    mobileScrollSupport: false
  }
);

/* ===== LOAD PDF ===== */
pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {

  const pages = [];

  for (let num = 1; num <= pdf.numPages; num++) {

    pages.push(
      pdf.getPage(num).then(page => {

        const scale = 2;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        const dpr = window.devicePixelRatio || 1;

        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;

        canvas.style.width = pageWidth + "px";
        canvas.style.height = pageHeight + "px";

        context.setTransform(dpr, 0, 0, dpr, 0, 0);

        return page.render({
          canvasContext: context,
          viewport: viewport
        }).promise.then(() => canvas);
      })
    );
  }

  Promise.all(pages).then(resolvedPages => {
    pageFlip.loadFromHTML(resolvedPages);

    // Fade in setelah PDF selesai render
    document.getElementById("book").classList.add("show");
  });

});

/* ===== GUEST NAME SYSTEM ===== */
const params = new URLSearchParams(window.location.search);
let guest = params.get("to");

if (!guest) {
  guest = "Tamu Undangan";
}

guest = decodeURIComponent(guest.replace(/\+/g, " "));

document.getElementById("guest-name").innerHTML = `
  Prepared Exclusively for
  <strong>${guest}</strong>
`;

/* ===== FADE IN HEADER & GUEST ===== */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("title").classList.add("show");
  }, 200);

  setTimeout(() => {
    document.getElementById("guest-name").classList.add("show");
  }, 500);
});
</script>

</body>
</html>
