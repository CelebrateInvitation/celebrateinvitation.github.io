<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<!-- Premium Elegant Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  background: radial-gradient(circle at top, #1a1a1a 0%, #000 70%);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
  color:white;
  overflow-x:hidden;
}

/* GOLD LIGHT EFFECT */
body::before{
  content:"";
  position:fixed;
  top:-200px;
  width:800px;
  height:800px;
  background:radial-gradient(circle, rgba(212,175,55,0.25) 0%, transparent 70%);
  z-index:0;
}

/* FADE ANIMATION */
.fade-in{
  opacity:0;
  transform:translateY(30px);
  transition:all 1.2s ease;
}

.fade-in.show{
  opacity:1;
  transform:translateY(0);
}

/* HEADER */
h2{
  margin-top:60px;
  font-family:'Playfair Display', serif;
  font-size:42px;
  letter-spacing:6px;
  font-weight:600;
  text-transform:uppercase;
  color:#f5f5f5;
  z-index:1;
}

/* GOLD LINE */
.gold-line{
  width:180px;
  height:2px;
  background:linear-gradient(to right, transparent, #d4af37, transparent);
  margin:20px auto;
}

/* GUEST BOX */
#guest-name{
  margin-top:20px;
  padding:20px 40px;
  border:1px solid rgba(212,175,55,0.5);
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(6px);
  border-radius:12px;
  font-size:14px;
  letter-spacing:2px;
  text-align:center;
  z-index:1;
}

#guest-name strong{
  display:block;
  margin-top:8px;
  font-size:22px;
  font-weight:600;
  color:#d4af37;
  letter-spacing:3px;
}

/* BOOK CONTAINER */
#book{
  margin-top:60px;
  box-shadow:0 60px 120px rgba(0,0,0,0.7);
  border-radius:16px;
  z-index:1;
}
</style>
</head>

<body>

<h2 class="fade-in" id="title">Raka & Amanda</h2>
<div class="gold-line fade-in" id="line"></div>

<div id="guest-name" class="fade-in"></div>

<div id="book" class="fade-in"></div>

<!-- Background Music -->
<audio id="bg-music" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Flip Sound -->
<audio id="flipSound" preload="auto">
  <source src="paper-flip.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";

const pageWidth = 500;
const pageHeight = 707;

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: pageWidth,
    height: pageHeight,
    size: "fixed",
    autoSize: false,
    showCover: true,
    usePortrait: false,
    maxShadowOpacity: 0.4,
    flippingTime: 900,
    mobileScrollSupport: false
  }
);

/* ===============================
   AUDIO SYSTEM (NO SOUND ON LOAD)
================================ */

const flipSound = document.getElementById("flipSound");

/* Unlock audio on first click (tanpa bunyi) */
document.addEventListener("click", function unlockAudio() {
  flipSound.play().then(() => {
    flipSound.pause();
    flipSound.currentTime = 0;
  }).catch(()=>{});
  
  document.removeEventListener("click", unlockAudio);
});

let isFirstFlip = true;

pageFlip.on("flip", function (e) {

  // Jangan bunyi saat event pertama load
  if (isFirstFlip) {
    isFirstFlip = false;
    return;
  }

  flipSound.currentTime = 0;
  flipSound.play().catch(()=>{});
});

/* ===============================
   LOAD PDF SHARP (RETINA)
================================ */

pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {

  const pages = [];

  for (let num = 1; num <= pdf.numPages; num++) {

    pages.push(
      pdf.getPage(num).then(page => {

        const scale = 2;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        const dpr = window.devicePixelRatio || 1;

        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;

        canvas.style.width = pageWidth + "px";
        canvas.style.height = pageHeight + "px";

        context.setTransform(dpr, 0, 0, dpr, 0, 0);

        return page.render({
          canvasContext: context,
          viewport: viewport
        }).promise.then(() => canvas);
      })
    );
  }

  Promise.all(pages).then(resolvedPages => {
    pageFlip.loadFromHTML(resolvedPages);
    document.getElementById("book").classList.add("show");
  });

});

/* ===============================
   GUEST NAME SYSTEM
================================ */

const params = new URLSearchParams(window.location.search);
let guest = params.get("to");

if (!guest) {
  guest = "Tamu Undangan";
}

guest = decodeURIComponent(guest.replace(/\+/g, " "));

document.getElementById("guest-name").innerHTML = `
  PREPARED EXCLUSIVELY FOR
  <strong>${guest}</strong>
`;

/* ===============================
   FADE IN SEQUENCE
================================ */

window.addEventListener("load", () => {

  setTimeout(() => {
    document.getElementById("title").classList.add("show");
  }, 200);

  setTimeout(() => {
    document.getElementById("line").classList.add("show");
  }, 500);

  setTimeout(() => {
    document.getElementById("guest-name").classList.add("show");
  }, 800);

});
</script>

</body>
</html>
