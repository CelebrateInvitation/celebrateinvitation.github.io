<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

<style>
body {
  margin:0;
  background:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial, sans-serif;
}

#flipbook {
  width:800px;
  height:500px;
  margin-top:30px;
}

.page {
  width:400px;
  height:500px;
  background:white;
  overflow:hidden;
}

canvas {
  width:100%;
  height:100%;
}

button {
  margin-top:20px;
  padding:10px 20px;
  border:none;
  background:black;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>Raka & Amanda</h2>

<div id="flipbook"></div>

<button onclick="$('#flipbook').turn('previous')">Prev</button>
<button onclick="$('#flipbook').turn('next')">Next</button>

<audio autoplay loop>
  <source src="i finally found someone lyrics.mp3" type="audio/mpeg">
</audio>

<script>
const url = "magazinevol1.pdf";

pdfjsLib.getDocument(url).promise.then(pdf => {

  for(let i=1; i<=pdf.numPages; i++){

    pdf.getPage(i).then(page => {

      let viewport = page.getViewport({scale:1});
      let canvas = document.createElement("canvas");
      let context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      page.render({
        canvasContext: context,
        viewport: viewport
      });

      let div = document.createElement("div");
      div.className = "page";
      div.appendChild(canvas);

      document.getElementById("flipbook").appendChild(div);

      if(i === pdf.numPages){
        $("#flipbook").turn({
          width:800,
          height:500,
          autoCenter:true
        });
      }

    });

  }

});
</script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</body>
</html>
