<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin:0;
  background: linear-gradient(to bottom, #e9e9e9, #cfcfcf);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial;
}

/* WRAPPER untuk retina scale */
#wrapper {
  margin-top:40px;
  transform: scale(0.5);              /* ukuran visual */
  transform-origin: top center;
  width: 1000px;                      /* HARUS sama dengan renderWidth */
}

/* container flipbook */
#book {
  box-shadow: 0 40px 80px rgba(0,0,0,0.3);
  border-radius: 12px;
}

canvas {
  image-rendering: auto;
}
</style>
</head>

<body>

<h2>Raka & Amanda</h2>

<div id="wrapper">
  <div id="book"></div>
</div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ================================
   RETINA RENDER FIX
================================ */

const pageWidth = 500;
const pageHeight = 707;

/* render 2x lebih besar supaya tajam */
const renderWidth = pageWidth * 2;    // 1000
const renderHeight = pageHeight * 2;  // 1414

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: renderWidth,
    height: renderHeight,
    size: "fixed",
    autoSize: false,
    showCover: true,
    maxShadowOpacity: 0.3,
    drawShadow: true,
    flippingTime: 800,
    usePortrait: false,   // 2 halaman
    mobileScrollSupport: false
  }
);

pageFlip.loadFromImages([
  "1.png",
  "2.png",
  "3.png",
  "4.png",
  "5.png",
  "6.png",
  "7.png",
  "8.png"
]);
</script>

</body>
</html>
