<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin:0;
  background: linear-gradient(to bottom, #e9e9e9, #cfcfcf);
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial;
}

#book {
  margin-top:40px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.3);
  border-radius: 12px;
}

.page {
  background:white;
}

img {
  width:100%;
  height:auto;
  display:block;
}

canvas {
  image-rendering: auto;
}
</style>
</head>

<body>

<h2>Fix Raka & Amanda</h2>

<div id="book"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const scale = window.devicePixelRatio || 1;

const pageWidth = 500;
const pageHeight = 707;

// render 2x lebih besar
const renderWidth = pageWidth * 2;
const renderHeight = pageHeight * 2;

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: renderWidth,
    height: renderHeight,
    size: "fixed",
    autoSize: false,
    showCover: true,
    maxShadowOpacity: 0.3,
    drawShadow: true,
    flippingTime: 800,
    usePortrait: false,
    mobileScrollSupport: false
  }
);

pageFlip.loadFromImages([
  "1.png",
  "2.png",
  "3.png",
  "4.png",
  "5.png",
  "6.png",
  "7.png",
  "8.png"
]);

// kecilkan tampilan visual ke ukuran normal
document.getElementById("book").style.transform = "scale(0.5)";
document.getElementById("book").style.transformOrigin = "top center";
</script>

</body>
</html>
