<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine of Raka & Amanda</title>

<style>
body{
  margin:0;
  font-family: 'Georgia', serif;
  background:#f8f5f0;
  text-align:center;
  color:#333;
}

.cover{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#e8dfd2;
}

button{
  padding:12px 30px;
  background:#b89b5e;
  color:white;
  border:none;
  border-radius:5px;
  font-size:16px;
  cursor:pointer;
}

.section{
  padding:60px 20px;
}

.nama-tamu{
  margin-top:15px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="cover">
  <h1>Special Wedding Issue of</h1>
  <h2>Raka & Amanda</h2>
  <div class="nama-tamu" id="guest"></div>
  <br>
  <button onclick="openInvite()">Start Experience</button>
</div>

<div id="content" style="display:none;">

  <div class="section">
    <h2>Wedding Journal</h2>
    <iframe src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" width="100%" height="600"></iframe>
  </div>

  <div class="section">
    <h2>RSVP</h2>
    <p>Form RSVP akan ditambahkan di sini</p>
  </div>

</div>

<audio id="music" src="music.mp3" loop></audio>

<script>
function getGuest(){
  const params = new URLSearchParams(window.location.search);
  return params.get("to");
}

function openInvite(){
  document.querySelector(".cover").style.display="none";
  document.getElementById("content").style.display="block";
  document.getElementById("music").play();
}

const guest = getGuest();
if(guest){
  document.getElementById("guest").innerHTML =
  "Kepada Yth.<br><strong>"+guest+"</strong>";
}
</script>

</body>
</html>
