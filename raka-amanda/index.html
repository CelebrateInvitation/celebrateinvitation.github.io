<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raka & Amanda Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:'Montserrat', sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* White luxury glow */
body::before{
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:1200px;
  height:1200px;
  background:radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:0;
}

/* Moving light */
.light-effect{
  position:fixed;
  top:0;
  left:-50%;
  width:50%;
  height:100%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.05),
    transparent
  );
  transform:skewX(-20deg);
  animation:lightMove 8s linear infinite;
  pointer-events:none;
  z-index:1;
}

@keyframes lightMove{
  0%{ left:-50%; }
  100%{ left:150%; }
}

.fade-in{
  opacity:0;
  transform:translateY(20px);
  transition:all 1.2s ease;
}
.fade-in.show{
  opacity:1;
  transform:translateY(0);
}

h2{
  margin-top:50px;
  font-weight:300;
  letter-spacing:6px;
  font-size:28px;
  text-transform:uppercase;
  z-index:2;
}

#guest-name{
  margin-top:15px;
  font-size:14px;
  letter-spacing:2px;
  color:#aaa;
  text-align:center;
  z-index:2;
}
#guest-name strong{
  display:block;
  margin-top:8px;
  font-size:20px;
  font-weight:600;
  color:#fff;
}

#book-wrapper{
  margin-top:60px;
  perspective:2500px;
  z-index:2;
}

#book{
  position:relative;
  border-radius:14px;
  transform-origin: top center;

  box-shadow:
    0 60px 180px rgba(0,0,0,0.9),     /* shadow bawah dalam */
    0 20px 60px rgba(255,255,255,0.05),
    inset 0 0 20px rgba(255,255,255,0.03);

  background:#111;
}

#book::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:4px;
  transform:translateX(-50%);
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(255,255,255,0.15),
    rgba(0,0,0,0.6),
    rgba(255,255,255,0.15),
    transparent
  );
  pointer-events:none;
}
  
canvas{
  border-radius:6px;
  background:#000;
}
</style>
</head>

<body>

<div class="light-effect"></div>

<h2 class="fade-in" id="title">Raka & Amanda</h2>
<div id="guest-name" class="fade-in"></div>

<div id="book-wrapper" class="fade-in">
  <div id="book"></div>
</div>

<audio id="bg-music" loop playsinline>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="flipSound" preload="auto">
  <source src="paper-flip.mp3" type="audio/mpeg">
</audio>

<script>
const pdfUrl = "magazinevol1.pdf";
const pageWidth = 500;
const pageHeight = 707;
const isMobile = window.innerWidth < 768;

const bookElement = document.getElementById("book");

/* ===== PAGEFLIP SETUP ===== */
const pageFlip = new St.PageFlip(bookElement, {
  width: pageWidth,
  height: pageHeight,
  size: "fixed",
  autoSize: false,
  showCover: true,
  usePortrait: false,       // tetap 2 halaman di HP

  flippingTime: 800,        // natural speed
  maxShadowOpacity: 0.6,    // shadow lebih dalam
  drawShadow: true,

  mobileScrollSupport: false,
  useMouseEvents: true,
  swipeDistance: 15         // responsif tapi stabil
});

/* ===== SCALE RESPONSIVE ===== */
function scaleBook(){
  const screenWidth = window.innerWidth;
  const fullWidth = pageWidth * 2;
  const scale = Math.min(screenWidth / fullWidth, 1);
  bookElement.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", scaleBook);

/* ===== CUSTOM SWIPE MOBILE ===== */
if(isMobile){

  let startX = 0;
  let startY = 0;
  let isValidSwipe = false;

  bookElement.addEventListener("touchstart", (e)=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isValidSwipe = true;
  });

  bookElement.addEventListener("touchmove", (e)=>{
    const moveX = e.touches[0].clientX;
    const moveY = e.touches[0].clientY;

    const diffX = moveX - startX;
    const diffY = moveY - startY;

    if(Math.abs(diffY) > Math.abs(diffX)){
      isValidSwipe = false;
    }
  });

  bookElement.addEventListener("touchend", (e)=>{
    if(!isValidSwipe) return;

    const endX = e.changedTouches[0].clientX;
    const diff = endX - startX;

    if(Math.abs(diff) > 120){
      if(diff < 0){
        pageFlip.flipNext();
      } else {
        pageFlip.flipPrev();
      }
    }
  });
}

/* ===== AUDIO ===== */
const flipSound = document.getElementById("flipSound");
const bgMusic = document.getElementById("bg-music");

document.addEventListener("click", function unlock(){
  bgMusic.volume = 0.6;
  bgMusic.play().catch(()=>{});
  document.removeEventListener("click", unlock);
});

let isFirstFlip = true;

pageFlip.on("flip", function(e){
  if(isFirstFlip){
    isFirstFlip = false;
    return;
  }
  flipSound.currentTime = 0;
  flipSound.play().catch(()=>{});
});

/* ===== PDF RENDER ===== */
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

pdfjsLib.getDocument({
  url: pdfUrl,
  disableAutoFetch: false,
  disableStream: false
}).promise.then(async pdf=>{

  const isMobile = window.innerWidth < 768;

  // 🔥 DPR dibatasi supaya tidak berat
  const dpr = Math.min(window.devicePixelRatio || 1, 1.8);

  // 🔥 Scale realistis tapi ringan
  const renderScale = isMobile ? 1.1 : 1.4;

  const pages = [];

  for(let i=1;i<=pdf.numPages;i++){

    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: renderScale });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width * dpr;
    canvas.height = viewport.height * dpr;

    canvas.style.width = pageWidth + "px";
    canvas.style.height = pageHeight + "px";

    context.setTransform(dpr,0,0,dpr,0,0);

    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = "high";

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    pages.push(canvas);
  }

  pageFlip.loadFromHTML(pages);
  scaleBook();
});

/* ===== GUEST SYSTEM ===== */
const params = new URLSearchParams(window.location.search);
let guest = params.get("to") || "Tamu Undangan";
guest = decodeURIComponent(guest.replace(/\+/g," "));

document.getElementById("guest-name").innerHTML =
`PREPARED EXCLUSIVELY FOR<br><strong>${guest}</strong>`;

/* ===== FADE IN ===== */
window.addEventListener("load",()=>{
  setTimeout(()=>document.getElementById("title").classList.add("show"),300);
  setTimeout(()=>document.getElementById("guest-name").classList.add("show"),700);
});
</script>

</body>
</html>
