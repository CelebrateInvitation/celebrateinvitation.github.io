<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raka & Amanda Wedding Invitation</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin:0;
  background:#cfcfcf;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial;
}

#book {
  margin-top:40px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.3);
  border-radius: 12px;
}

.page {
  background:white;
}

img {
  width:100%;
  height:auto;
  display:block;
}
</style>
</head>

<body>

<h2>Raka & Amanda</h2>

<div id="book"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 450,
    height: 636,
    size: "fixed",
    showCover: true,
    maxShadowOpacity: 0.15, // lebih ringan
    drawShadow: false,      // MATIKAN shadow berat
    flippingTime: 600,      // animasi lebih cepat & halus
    usePortrait: true,
    mobileScrollSupport: false
  }
);

pageFlip.loadFromImages([
  "page1.jpg",
  "page2.jpg",
  "page3.jpg",
  "page4.jpg",
  "page5.jpg",
  "page6.jpg",
  "page7.jpg",
  "page8.jpg"
]);
</script>

</body>
</html>
