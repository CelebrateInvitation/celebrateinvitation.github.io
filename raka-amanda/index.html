<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Raka & Amanda Magazine</title>

  <!-- Flipbook Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    canvas {
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 20px 10px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<h2>Raka & Amanda</h2>

<button onclick="prevPage()">Prev</button>
<button onclick="nextPage()">Next</button>

<br>
<canvas id="pdf-render"></canvas>

<!-- Music -->
<audio autoplay loop>
  <source src="i finally found someone lyrics.mp3" type="audio/mpeg">
</audio>

<script>
  const url = 'magazinevol1.pdf';
  let pdfDoc = null,
      pageNum = 1,
      canvas = document.getElementById('pdf-render'),
      ctx = canvas.getContext('2d');

  pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
    pdfDoc = pdfDoc_;
    renderPage(pageNum);
  });

  function renderPage(num) {
    pdfDoc.getPage(num).then(page => {
      const viewport = page.getViewport({ scale: 1.5 });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      page.render({
        canvasContext: ctx,
        viewport: viewport
      });
    });
  }

  function prevPage() {
    if (pageNum <= 1) return;
    pageNum--;
    renderPage(pageNum);
  }

  function nextPage() {
    if (pageNum >= pdfDoc.numPages) return;
    pageNum++;
    renderPage(pageNum);
  }
</script>

</body>
</html>
